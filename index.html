<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Wedding of Raka & Nadia</title>
  <meta name="description" content="Undangan pernikahan Raka & Nadia, Sabtu 12 Desember 2026 di Lembang, Bandung Barat.">
  <meta name="theme-color" content="#F8F6F1">

  <meta property="og:type" content="website">
  <meta property="og:title" content="The Wedding of Raka & Nadia">
  <meta property="og:description" content="Sabtu, 12 Desember 2026. Kebun Kalaras, Lembang.">
  <meta property="og:image" content="assets/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@400;500;600&family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="is-locked">
  <section class="cover" id="cover" aria-label="Sampul undangan">
    <div class="cover-photo">
      <img id="coverImg" alt="Raka dan Nadia" fetchpriority="high">
    </div>
    <div class="cover-body">
      <p class="eyebrow">The Wedding of</p>
      <h1 class="cover-names" id="coverNames"></h1>
      <p class="cover-date" id="coverDate"></p>
      <div class="cover-guest">
        <span>Kepada Yth.</span>
        <strong id="guestName"></strong>
      </div>
      <button class="btn-main" id="openBtn" type="button"></button>
    </div>
  </section>

  <div class="layout">
    <aside class="stage" aria-hidden="true">
      <img class="stage-img" id="stageImg" alt="">
    </aside>
    <main id="app" class="content" tabindex="-1"></main>
  </div>

  <nav class="dock" id="dock" aria-label="Navigasi undangan"></nav>

  <div class="modal fade lightbox" id="lightbox" tabindex="-1" aria-label="Foto galeri" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content">
        <button class="lb-btn lb-close" type="button" data-bs-dismiss="modal" aria-label="Tutup"><span class="ic i-xmark"></span></button>
        <button class="lb-btn lb-prev" type="button" aria-label="Foto sebelumnya"><span class="ic i-nav-arrow-left"></span></button>
        <img class="lb-img" id="lbImg" alt="">
        <button class="lb-btn lb-next" type="button" aria-label="Foto berikutnya"><span class="ic i-nav-arrow-right"></span></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
